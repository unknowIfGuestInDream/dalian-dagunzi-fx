/*
 * 大连打滚子 (Dalian Da Gunzi) 构建脚本
 *
 * 2.0.0 起使用 libgdx 重写桌面 UI（替换原 JavaFX），并以 Gradle 替代 Maven：
 *   - JDK 25 工具链
 *   - libgdx 1.13.1 + LWJGL3 桌面后端 + FreeType（支持中文字体）
 *   - JUnit 5 单元测试（覆盖引擎/AI/模型等与 UI 无关的核心逻辑）
 *   - 源文件 license 头校验（license 插件，等价于原 license-maven-plugin）
 *   - 打包出可被 jpackage 使用的 `dalian-dagunzi.jar` + `lib/` 依赖目录
 *
 * 依赖仓库优先使用阿里云镜像，加速国内构建。
 */
buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // license 插件（等价于原 license-maven-plugin）。其默认传递依赖 plexus-utils 2.0.6
        // 存在命令注入与目录穿越漏洞（GHSA-8vhq-qq4p-grq3 等），这里排除旧版并强制改用已修复的 3.6.1。
        classpath('gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:0.16.1') {
            exclude group: 'org.codehaus.plexus', module: 'plexus-utils'
        }
        classpath 'org.codehaus.plexus:plexus-utils:3.6.1'
    }
}

plugins {
    id 'java'
    id 'application'
}

// 以传统方式应用 license 插件，以便在 buildscript 中控制其传递依赖版本（见上方 plexus-utils 说明）
apply plugin: 'com.github.hierynomus.license'

group = project.findProperty('group') ?: 'com.tlcsdm.game'
version = project.findProperty('version') ?: '2.0.0'
description = 'DaLian DaGunZi'

ext.gdxVersion = project.findProperty('gdxVersion') ?: '1.13.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // 阿里云公共仓库镜像优先，官方中央仓库作为回退
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // libgdx 核心 + LWJGL3 桌面后端 + 桌面本地库
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    // FreeType 字体扩展：运行时按需生成中文字形
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"

    // 日志
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    // 更新检查使用 Gson 解析 GitHub Release
    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

application {
    // libgdx 使用类路径模式运行（gdx jar 非标准模块），桌面入口为 LWJGL3 启动器
    mainClass = 'com.tlcsdm.game.daliandagunzifx.lwjgl3.DesktopLauncher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 主 Jar：主类为 Launcher（类路径模式，供 jpackage/独立运行使用），依赖置于 lib/ 目录
jar {
    archiveFileName = 'dalian-dagunzi.jar'
    manifest {
        attributes(
            'Main-Class': 'com.tlcsdm.game.daliandagunzifx.Launcher',
            'Class-Path': configurations.runtimeClasspath.collect { 'lib/' + it.name }.join(' '),
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Bundle-SymbolicName': "${project.group}.${project.name}",
            'Bundle-Vendor': 'Tlcsdm',
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

// 将运行时依赖复制到 build/app/lib，供 jpackage 使用（等价于原 maven-dependency-plugin copy-dependencies）
tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('app/lib')
}

// 将主 Jar 复制到 build/app，与 lib/ 共同组成 jpackage 的 --input 目录
tasks.register('copyAppJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into layout.buildDirectory.dir('app')
}

// 组装可分发目录 build/app（dalian-dagunzi.jar + lib/）
tasks.register('appImage') {
    group = 'distribution'
    description = '组装 build/app 目录：dalian-dagunzi.jar 与 lib/ 运行时依赖'
    dependsOn tasks.named('copyDependencies'), tasks.named('copyAppJar')
}

tasks.named('assemble') {
    dependsOn tasks.named('appImage')
}

// 输出纯版本号，供 CI/打包脚本解析（等价于原 mvn help:evaluate -Dexpression=project.version）
tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

// 源文件 license 头校验（等价于原 license-maven-plugin）
license {
    header = rootProject.file('license-header.txt')
    strictCheck = true
    ext.year = Calendar.getInstance().get(Calendar.YEAR)
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
    include '**/*.java'
}
