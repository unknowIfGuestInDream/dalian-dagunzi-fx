/*
 * 大连打滚子 (Dalian Da Gunzi) 构建脚本
 *
 * 2.0.0 起使用 libgdx 重写桌面 UI（替换原 JavaFX），并以 Gradle 替代 Maven：
 *   - JDK 25 工具链
 *   - libgdx 1.14.2 + LWJGL3 桌面后端 + FreeType（支持中文字体）
 *   - JUnit 5 单元测试 + JaCoCo 覆盖率报告（覆盖引擎/AI/模型等与 UI 无关的核心逻辑）
 *   - 源文件 license 头校验（license 插件，等价于原 license-maven-plugin）
 *   - 打包出可被 jpackage 使用的 `dalian-dagunzi.jar` + `lib/` 依赖目录
 *
 * 依赖仓库优先使用阿里云镜像，加速国内构建。
 */
buildscript {
    ext.springCoreVersion = '6.2.11'
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        // license 插件（等价于原 license-maven-plugin）。其传递依赖存在多个高危漏洞，这里一并处理：
        //  - plexus-utils 2.0.6：命令注入 / 目录穿越（GHSA-8vhq-qq4p-grq3 等），强制改用已修复的 3.6.1；
        //  - spring-core / spring-asm 3.1.3.RELEASE：权限提升 / 路径保护绕过等高危漏洞。license 插件仅
        //    用到 spring-core 的 PropertyPlaceholderHelper（解析 license 头中的 ${year} 占位符），该 API
        //    自 Spring 3.0 起稳定不变，故排除整组漏洞版 Spring，改用已修复的 spring-core 6.2.11（不再需要
        //    已并入核心的 spring-asm），既消除 dependency-review 高危告警又不影响 license 校验功能。
        classpath('gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:0.16.1') {
            exclude group: 'org.codehaus.plexus', module: 'plexus-utils'
            exclude group: 'org.springframework'
        }
        classpath 'org.codehaus.plexus:plexus-utils:4.1.0'
        // 注意：这里是 Gradle 构建期 classpath（供 license 插件使用），不会进入应用运行时依赖树。
        classpath "org.springframework:spring-core:${springCoreVersion}"
    }
}

plugins {
    id 'java'
    id 'application'
    // 代码覆盖率：生成 JUnit 测试的分支/行覆盖率报告（HTML + XML），辅助评估测试完备度
    id 'jacoco'
}

// 以传统方式应用 license 插件，以便在 buildscript 中控制其传递依赖版本（见上方 plexus-utils 说明）
apply plugin: 'com.github.hierynomus.license'

group = project.findProperty('group') ?: 'com.tlcsdm.game'
version = project.findProperty('version') ?: '2.0.0'
description = 'DaLian DaGunZi'

ext.gdxVersion = '1.14.2'
ext.junitVersion = '6.1.3'
// libgdx 的 LWJGL3 后端传递依赖 LWJGL 3.3.3，其在 JDK 24+ 上会调用已弃用的 sun.misc.Unsafe::objectFieldOffset，
// 并因无法识别新版 JNI 版本而打印 "Unsupported JNI version" 提示。LWJGL 在 3.3.x 内保持二进制兼容，
// 3.3.6 改用 FFM 后端并适配 JDK 25，这里统一强制升级以消除上述启动告警。
ext.lwjglVersion = '3.3.6'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 统一以 UTF-8 编译源码，确保源文件中的中文与花色符号（♠♥♦♣ 等）在任意系统默认
// 编码（如中文 Windows 的 GBK）下都能正确读取，避免字符损坏导致运行时显示为方块。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    // 阿里云公共仓库镜像优先，官方中央仓库作为回退
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // libgdx 核心 + LWJGL3 桌面后端 + 桌面本地库
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    // FreeType 字体扩展：运行时按需生成中文字形
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"

    // 日志
    implementation 'ch.qos.logback:logback-classic:1.6.6'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    // 更新检查使用 Gson 解析 GitHub Release
    implementation 'com.google.code.gson:gson:2.15.0'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitVersion}"
}

// 将 libgdx 传递引入的全部 org.lwjgl 模块（含本地库）统一强制为同一新版，保持 Java 侧与
// natives 版本一致，消除 3.3.3 在 JDK 25 下的 Unsafe/JNI 启动告警（见上方 lwjglVersion 说明）。
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion lwjglVersion
            details.because 'LWJGL 3.3.6 适配 JDK 25（FFM 后端），消除 Unsafe/JNI 启动告警'
        }
    }
}

application {
    // libgdx 使用类路径模式运行（gdx jar 非标准模块），桌面入口为 LWJGL3 启动器
    mainClass = 'com.tlcsdm.game.daliandagunzifx.lwjgl3.DesktopLauncher'
    // 运行期 JVM 参数：
    //  - --enable-native-access=ALL-UNNAMED：libgdx/LWJGL 通过 System.load 加载本地库，
    //    JDK 24+ 默认会对未授权的本地访问打印 "restricted method ... has been called" 警告，
    //    显式授权后消除该告警（打包运行见 jpackage 的 --java-options、脚本见 start.bat）。
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // 测试完成后自动生成覆盖率报告
    finalizedBy tasks.named('jacocoTestReport')
}

// JaCoCo 覆盖率报告：输出 HTML（build/reports/jacoco/test/html/index.html）与 XML（供 CI 上传）
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// 主 Jar：主类为 Launcher（类路径模式，供 jpackage/独立运行使用），依赖置于 lib/ 目录
jar {
    archiveFileName = 'dalian-dagunzi.jar'
    manifest {
        attributes(
            'Main-Class': 'com.tlcsdm.game.daliandagunzifx.Launcher',
            'Class-Path': configurations.runtimeClasspath.collect { 'lib/' + it.name }.join(' '),
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Bundle-SymbolicName': "${project.group}.${project.name}",
            'Bundle-Vendor': 'Tlcsdm',
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

// 将运行时依赖复制到 build/app/lib，供 jpackage 使用（等价于原 maven-dependency-plugin copy-dependencies）
tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('app/lib')
}

// 将主 Jar 复制到 build/app，与 lib/ 共同组成 jpackage 的 --input 目录
tasks.register('copyAppJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into layout.buildDirectory.dir('app')
}

// 组装可分发目录 build/app（dalian-dagunzi.jar + lib/）
tasks.register('appImage') {
    group = 'distribution'
    description = '组装 build/app 目录：dalian-dagunzi.jar 与 lib/ 运行时依赖'
    dependsOn tasks.named('copyDependencies'), tasks.named('copyAppJar')
}

tasks.named('assemble') {
    dependsOn tasks.named('appImage')
}

// 输出纯版本号，供 CI/打包脚本解析（等价于原 mvn help:evaluate -Dexpression=project.version）
tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

// 源文件 license 头校验（等价于原 license-maven-plugin）
license {
    header = rootProject.file('license-header.txt')
    strictCheck = true
    ext.year = Calendar.getInstance().get(Calendar.YEAR)
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
    include '**/*.java'
}
