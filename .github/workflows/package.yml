name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        shell: bash
        run: ./gradlew clean appImage -x test --no-daemon

      - name: Prepare distribution
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/dalian-dagunzi.jar dist/
          cp -r build/app/lib dist/
          cp LICENSE dist/
          cp README.md dist/
          mkdir -p dist/docs
          cp docs/规则.md dist/docs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalian-dagunzi-${{ matrix.os }}
          path: dist/
          retention-days: 1

  package-windows:
    name: Package on windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        shell: pwsh
        run: |
          & scripts\build.ps1

      - name: Resolve version & jar
        shell: pwsh
        run: |
          & scripts\resolve-version.ps1

      - name: Create Custom JRE with jlink
        shell: pwsh
        run: |
          & scripts\jre.ps1 -StagingDir staging

      - name: Package artifact
        shell: pwsh
        run: |
          & scripts\package-artifact.ps1

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalian-dagunzi-windows-latest
          path: dist/*
          retention-days: 1
