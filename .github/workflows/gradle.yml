# 使用 Gradle 构建并测试 Java 项目，同时缓存依赖以加速工作流
# 参考：https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  pull_request:
    branches: [ 'master' ]
  push:
    branches: [ 'master' ]

permissions:
  contents: read
  checks: write

defaults:
  run:
    # 统一使用 bash 运行命令：Windows Runner 自带 Git Bash，可执行 POSIX 版 ./gradlew
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        experimental: [ false ]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon
      - name: Test with Gradle
        # test 完成后经 finalizedBy 自动执行 jacocoTestReport，生成 HTML/XML 覆盖率报告
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          flaky_summary: true
          include_time_in_summary: true
          group_suite: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JaCoCo coverage report
        # 仅在 Linux 任务上传一次覆盖率报告（HTML + XML），避免三平台重复产物
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: warn
